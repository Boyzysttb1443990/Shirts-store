<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boyzy Shop — Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Workshop.css">
    <link rel="stylesheet" href="admin.css">
</head>

<body>
    <header class="site-header">
        <div class="header-inner">
            <h1 class="wordmark"><span class="wordmark-main">BOYZY</span><span class="wordmark-sub">ADMIN</span></h1>
            <p class="header-tag">Order Management <span class="dot">·</span> Staff only</p>
            <div id="auth-status" class="auth-status"></div>
        </div>
    </header>

    <div class="admin-layout">

        <!-- Login gate: shown until an admin logs in -->
        <div id="admin-login-gate" class="paper-card admin-login-card">
            <h2>Admin Sign In</h2>
            <p class="admin-note">This page is for store staff only. Sign in with your admin account.</p>
            <form id="admin-login-form" onsubmit="handleAdminLogin(event)">
                <label for="admin-phone">Phone number</label>
                <input type="tel" id="admin-phone" placeholder="e.g. 020 5555 5555" required>

                <label for="admin-password">Password</label>
                <div class="password-field">
                    <input type="password" id="admin-password" placeholder="Your password" required>
                    <button type="button" class="password-toggle" onclick="togglePassword('admin-password', this)" aria-label="Show password">👁</button>
                </div>

                <p id="admin-login-error" class="auth-error"></p>
                <button type="submit" class="btn-primary">Sign In</button>
            </form>
        </div>

        <!-- Dashboard: shown once an admin is logged in -->
        <div id="admin-dashboard" style="display:none;">
            <section class="catalog-intro">
                <p class="eyebrow">Order Management</p>
                <h2>Every order, all in one place.</h2>
            </section>

            <div class="admin-summary">
                <div class="summary-card">
                    <span class="summary-label">Total Orders</span>
                    <span id="summary-count" class="summary-value">0</span>
                </div>
                <div class="summary-card">
                    <span class="summary-label">Total Revenue</span>
                    <span id="summary-revenue" class="summary-value">0 VND</span>
                </div>
                <div class="summary-card">
                    <span class="summary-label">Pending</span>
                    <span id="summary-pending" class="summary-value">0</span>
                </div>
            </div>

            <div class="admin-toolbar">
                <button type="button" class="btn-link" onclick="loadAllOrders()">Refresh</button>
                <select id="status-filter" onchange="renderOrdersTable()">
                    <option value="all">All statuses</option>
                    <option value="pending">Pending</option>
                    <option value="confirmed">Confirmed</option>
                    <option value="shipped">Shipped</option>
                    <option value="delivered">Delivered</option>
                    <option value="cancelled">Cancelled</option>
                </select>
            </div>

            <div class="paper-card admin-table-card">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Order</th>
                            <th>Customer</th>
                            <th>Items</th>
                            <th>Total</th>
                            <th>Payment</th>
                            <th>Date</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="orders-table-body">
                        <tr><td colspan="7" class="table-empty">Loading orders...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Notice modal (styled replacement for browser alert()) -->
    <div id="notice-modal-overlay" class="modal-overlay" style="display:none;" onclick="closeNoticeModalOnOverlay(event)">
        <div class="modal-card notice-card">
            <div class="notice-icon">🏷️</div>
            <p id="notice-modal-message" class="notice-message"></p>
            <button type="button" class="btn-primary" onclick="closeNoticeModal()">OK</button>
        </div>
    </div>

    <!-- Confirm modal — asks before any status change, with an extra warning for risky jumps -->
    <div id="confirm-modal-overlay" class="modal-overlay" style="display:none;" onclick="closeConfirmModalOnOverlay(event)">
        <div class="modal-card notice-card">
            <div class="notice-icon">⚠️</div>
            <p id="confirm-modal-message" class="notice-message"></p>
            <p id="confirm-modal-warning" class="confirm-warning" style="display:none;"></p>
            <div class="confirm-buttons">
                <button type="button" class="btn-secondary" onclick="cancelStatusChange()">Cancel</button>
                <button type="button" class="btn-primary" onclick="confirmStatusChange()">Yes, Update</button>
            </div>
        </div>
    </div>

    <script>
        // ต้องตรงกับ API_BASE ในไฟล์ Workshop.html
        const API_BASE = "https://shirts-store.onrender.com/api";

        let authToken = localStorage.getItem("boyzy_token") || null;
        let currentUser = JSON.parse(localStorage.getItem("boyzy_user") || "null");
        let allOrders = [];

        function authHeaders() {
            return authToken ? { "Authorization": "Bearer " + authToken } : {};
        }

        function setAuth(token, user) {
            authToken = token;
            currentUser = user;
            localStorage.setItem("boyzy_token", token);
            localStorage.setItem("boyzy_user", JSON.stringify(user));
        }

        function clearAuth() {
            authToken = null;
            currentUser = null;
            localStorage.removeItem("boyzy_token");
            localStorage.removeItem("boyzy_user");
            renderGate();
        }

        function logout() {
            clearAuth();
        }

        function renderGate() {
            const statusEl = document.getElementById("auth-status");
            const gate = document.getElementById("admin-login-gate");
            const dashboard = document.getElementById("admin-dashboard");
            const errorEl = document.getElementById("admin-login-error");

            if (currentUser && currentUser.role === "admin") {
                statusEl.innerHTML = `
                    <span class="auth-greeting">Staff: ${currentUser.fullname.split(" ")[0]}</span>
                    <button type="button" class="btn-link" onclick="logout()">Log out</button>
                `;
                gate.style.display = "none";
                dashboard.style.display = "block";
                loadAllOrders();
            } else {
                if (currentUser && currentUser.role !== "admin") {
                    errorEl.textContent = "This account doesn't have admin access.";
                    clearAuthQuiet();
                }
                statusEl.innerHTML = `<span class="auth-greeting">Not signed in</span>`;
                gate.style.display = "block";
                dashboard.style.display = "none";
            }
        }

        function clearAuthQuiet() {
            authToken = null;
            currentUser = null;
            localStorage.removeItem("boyzy_token");
            localStorage.removeItem("boyzy_user");
        }

        function togglePassword(inputId, buttonEl) {
            const input = document.getElementById(inputId);
            const isHidden = input.type === "password";
            input.type = isHidden ? "text" : "password";
            buttonEl.textContent = isHidden ? "🙈" : "👁";
            buttonEl.setAttribute("aria-label", isHidden ? "Hide password" : "Show password");
        }

        async function handleAdminLogin(event) {
            event.preventDefault();
            const phone = document.getElementById("admin-phone").value.trim();
            const password = document.getElementById("admin-password").value;
            const errorEl = document.getElementById("admin-login-error");
            errorEl.textContent = "";

            try {
                const res = await fetch(`${API_BASE}/auth/login`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ phone, password })
                });
                const data = await res.json();
                if (!res.ok) {
                    errorEl.textContent = data.error || "Sign in failed.";
                    return;
                }
                if (data.user.role !== "admin") {
                    errorEl.textContent = "This account doesn't have admin access.";
                    return;
                }
                setAuth(data.token, data.user);
                renderGate();
            } catch (err) {
                errorEl.textContent = "Can't reach the server. Is the backend running?";
            }
        }

        async function loadAllOrders() {
            const tbody = document.getElementById("orders-table-body");
            tbody.innerHTML = `<tr><td colspan="7" class="table-empty">Loading orders...</td></tr>`;

            try {
                const res = await fetch(`${API_BASE}/orders/admin/all`, { headers: authHeaders() });
                if (res.status === 401 || res.status === 403) {
                    clearAuth();
                    return;
                }
                const data = await res.json();
                allOrders = data.orders || [];
                renderSummary();
                renderOrdersTable();
            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="7" class="table-empty">Can't reach the server</td></tr>`;
            }
        }

        function renderSummary() {
            document.getElementById("summary-count").textContent = allOrders.length;
            const revenue = allOrders.reduce((sum, o) => sum + o.total, 0);
            document.getElementById("summary-revenue").textContent = revenue.toLocaleString() + " VND";
            const pending = allOrders.filter(o => o.status === "pending").length;
            document.getElementById("summary-pending").textContent = pending;
        }

        function renderOrdersTable() {
            const tbody = document.getElementById("orders-table-body");
            const filter = document.getElementById("status-filter").value;
            const rows = filter === "all" ? allOrders : allOrders.filter(o => o.status === filter);

            if (rows.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="table-empty">No orders match this filter</td></tr>`;
                return;
            }

            tbody.innerHTML = rows.map(order => `
                <tr>
                    <td class="mono" data-label="Order">#${order.id}</td>
                    <td data-label="Customer">
                        <div class="cell-strong">${order.customer ? order.customer.fullname : "Unknown"}</div>
                        <div class="cell-muted mono">${order.customer ? order.customer.phone : "—"}</div>
                    </td>
                    <td class="cell-items" data-label="Items">${order.items.map(i => `${i.quantity}× ${i.name}${i.size ? ` (${i.size})` : ""}`).join("<br>")}</td>
                    <td class="mono cell-strong" data-label="Total">${order.total.toLocaleString()} VND</td>
                    <td class="mono" data-label="Payment">${order.payment}</td>
                    <td class="mono cell-muted" data-label="Date">${new Date(order.createdAt).toLocaleDateString()}</td>
                    <td data-label="Status">
                        ${renderStatusCell(order)}
                    </td>
                </tr>
            `).join("");
        }

        // ---------- Status change confirmation ----------
        // ลำดับปกติของสถานะ ใช้เช็คว่าแอดมินกำลัง "ข้ามขั้นตอน" อยู่ไหม (เช่น pending -> delivered ตรงๆ)
        const STATUS_SEQUENCE = ["pending", "confirmed", "shipped", "delivered"];

        let pendingStatusChange = null; // { orderId, newStatus, prevStatus, selectEl }

        function handleStatusChange(selectEl) {
            const orderId = Number(selectEl.dataset.orderId);
            const prevStatus = selectEl.dataset.prevStatus;
            const newStatus = selectEl.value;

            if (newStatus === prevStatus) return;

            pendingStatusChange = { orderId, newStatus, prevStatus, selectEl };

            const order = allOrders.find(o => o.id === orderId);
            const customerName = order && order.customer ? order.customer.fullname : "this customer";

            document.getElementById("confirm-modal-message").textContent =
                `Change order #${orderId} (${customerName}) from "${prevStatus}" to "${newStatus}"?`;

            const warningEl = document.getElementById("confirm-modal-warning");
            const warning = getStatusChangeWarning(prevStatus, newStatus);
            if (warning) {
                warningEl.textContent = warning;
                warningEl.style.display = "block";
            } else {
                warningEl.style.display = "none";
            }

            document.getElementById("confirm-modal-overlay").style.display = "flex";
        }

        function getStatusChangeWarning(prevStatus, newStatus) {
            if (newStatus === "cancelled") {
                return "⚠️ Cancelling an order that may already be paid can't be easily undone. Double check with the customer or payment records first.";
            }
            if (newStatus === "delivered") {
                return "⚠️ Only confirm this if the customer has actually received the package in hand — not just that it was handed to a courier.";
            }
            const prevIdx = STATUS_SEQUENCE.indexOf(prevStatus);
            const newIdx = STATUS_SEQUENCE.indexOf(newStatus);
            if (prevIdx !== -1 && newIdx !== -1 && newIdx - prevIdx > 1) {
                return `⚠️ This skips over "${STATUS_SEQUENCE[prevIdx + 1]}" — make sure that stage genuinely already happened.`;
            }
            return null;
        }

        function cancelStatusChange() {
            if (pendingStatusChange) {
                // คืนค่า dropdown กลับไปที่สถานะเดิม เพราะการเปลี่ยนใน <select> เกิดขึ้นก่อนที่จะยืนยันแล้ว
                pendingStatusChange.selectEl.value = pendingStatusChange.prevStatus;
            }
            pendingStatusChange = null;
            document.getElementById("confirm-modal-overlay").style.display = "none";
        }

        function closeConfirmModalOnOverlay(event) {
            if (event.target.id === "confirm-modal-overlay") {
                cancelStatusChange(); // คลิกนอกกล่อง = ยกเลิกอย่างปลอดภัย ไม่ใช่ยืนยันเฉยๆ
            }
        }

        async function confirmStatusChange() {
            if (!pendingStatusChange) return;
            const { orderId, newStatus } = pendingStatusChange;
            document.getElementById("confirm-modal-overlay").style.display = "none";
            await changeStatus(orderId, newStatus);
            pendingStatusChange = null;
        }

        async function changeStatus(orderId, status) {
            try {
                const res = await fetch(`${API_BASE}/orders/admin/${orderId}/status`, {
                    method: "PATCH",
                    headers: { "Content-Type": "application/json", ...authHeaders() },
                    body: JSON.stringify({ status })
                });
                if (!res.ok) {
                    showNotice("Couldn't update status. Please try again.");
                    loadAllOrders();
                    return;
                }
                const data = await res.json();
                const idx = allOrders.findIndex(o => o.id === orderId);
                if (idx !== -1) allOrders[idx].status = data.order.status;
                renderSummary();
                renderOrdersTable();
            } catch (err) {
                showNotice("Can't reach the server.");
            }
        }

        function showNotice(message) {
            document.getElementById("notice-modal-message").textContent = message;
            document.getElementById("notice-modal-overlay").style.display = "flex";
        }

        function closeNoticeModal() {
            document.getElementById("notice-modal-overlay").style.display = "none";
        }

        function closeNoticeModalOnOverlay(event) {
            if (event.target.id === "notice-modal-overlay") {
                closeNoticeModal();
            }
        }

        window.onload = renderGate;
    </script>
</body>

</html>
